<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeSci DAO — One DAO to represent them all.</title>
<meta name="description" content="DeSci DAO: capitalized prior to token launch, substantive multi-stage governance, and a token that is an index fund of DeSci tokens. Join the pre-token launch.">
<meta property="og:title" content="DeSci DAO">
<meta property="og:description" content="One DAO to represent them all. Join the pre-token DAO launch.">
<link rel="icon" href="token.svg" type="image/svg+xml">
<style>
@font-face{font-family:SG;font-weight:700;src:url(sg-700.woff2) format("woff2")}
@font-face{font-family:JB;font-weight:400;src:url(jb-400.woff2) format("woff2")}
@font-face{font-family:JB;font-weight:700;src:url(jb-700.woff2) format("woff2")}

:root{--fg:#f2f2f2;--dim:#8a8a8a;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050505;color:var(--fg);min-height:100%}
body{font:400 15px/1.5 JB,ui-monospace,monospace;
  background-image:radial-gradient(#1c1c1c 1px,transparent 1px);background-size:22px 22px;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:48px 20px}
.frame{position:fixed;inset:18px;pointer-events:none}
.frame i{position:absolute;width:18px;height:18px;border:0 solid var(--fg)}
.frame .a{top:0;left:0;border-top-width:1.5px;border-left-width:1.5px}
.frame .b{top:0;right:0;border-top-width:1.5px;border-right-width:1.5px}
.frame .c{bottom:0;left:0;border-bottom-width:1.5px;border-left-width:1.5px}
.frame .d{bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px}
main{width:100%;max-width:640px}
.meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.meta .hex{text-transform:none}
.token{width:min(260px,62vw);aspect-ratio:1;margin:36px auto 30px;display:block;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.token{animation:none}}
h1{font:700 clamp(48px,11vw,88px)/.95 SG,system-ui,sans-serif;letter-spacing:-.025em}
.sub{font-size:clamp(15px,3.6vw,19px);margin-top:14px}
.rule{border-top:1px dashed #555;margin:28px 0 20px}
ul{list-style:none}
li{display:flex;gap:14px;margin-bottom:10px;font-size:clamp(14px,3.3vw,16px)}
li b{min-width:30px}
form{margin-top:34px;display:flex;border:1px solid var(--fg)}
input[type=email]{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;padding:15px 16px;outline:none}
input[type=email]::placeholder{color:#666}
button{background:var(--fg);color:#050505;border:0;font:700 14px JB,monospace;letter-spacing:.06em;padding:0 22px;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:wait}
.hp{position:absolute;left:-9999px}
.status{min-height:22px;margin-top:10px;font-size:12px;color:var(--dim)}
.status.ok{color:var(--fg)}
footer{margin-top:44px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
footer span{display:inline-flex;align-items:center;gap:10px}
.go{height:15px;display:block}

.reserve{height:14px;display:block}
@media (max-width:520px){form{flex-direction:column}button{padding:15px 16px}.meta,.frame{display:none}.token{width:112px;margin:0 0 26px}body{align-items:flex-start;padding-top:40px}}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<main>
  <div class="meta"><span>// pre-token · <span class="hex">0x0001</span></span><span>launching 2027</span></div>
  <img class="token" src="token.svg" alt="DeSci DAO token: a beaker surrounded by circuitry">
  <h1>DeSci DAO</h1>
  <p class="sub">One DAO to represent them all.</p>
  <div class="rule"></div>
  <ul>
    <li><b>[1]</b>Capitalized prior to token launch</li>
    <li><b>[2]</b>Substantive multi-stage governance</li>
    <li><b>[3]</b>Token = index fund of DeSci tokens</li>
  </ul>
  <form id="join" novalidate>
    <label for="email" class="hp">Email</label>
    <input id="email" name="email" type="email" placeholder="you@domain.com" autocomplete="email" required>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Join the DeSci DAO →</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite">Sign up for the pre-token DAO launch.</p>
  <footer>
    <span>Founded by <img class="go" src="go.svg" alt="[GO]"></span>
    <span>Powered by <img class="reserve" src="reserve-white.png" alt="Reserve"></span>
  </footer>
</main>
<script>
// Paste the Google Apps Script web-app URL here once deployed (see SETUP.md).
const ENDPOINT = "";
const form = document.getElementById("join"), status = document.getElementById("status");
const src = new URLSearchParams(location.search).get("src") || "web";
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = form.email.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { status.className = "status"; status.textContent = "Please enter a valid email."; return; }
  if (form.website.value) return; // bot
  const btn = form.querySelector("button"); btn.disabled = true; status.className = "status"; status.textContent = "Submitting…";
  try {
    if (!ENDPOINT) throw new Error("no endpoint");
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: new URLSearchParams({ email, src }) });
    form.reset(); status.className = "status ok"; status.textContent = "You're on the list. We'll be in touch before launch.";
  } catch (err) {
    status.textContent = "Sign-ups open shortly. Please try again soon.";
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
